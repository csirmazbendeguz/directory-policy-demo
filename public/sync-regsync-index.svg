<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Directory A syncs to Directory B. Regsync copies Directory A's OCI registry into Directory B's OCI registry. The indexer then writes Directory B's registry into its database.">
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#18181b"></path>
    </marker>
  </defs>
  <g fill="none" stroke="#18181b" stroke-width="1.5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">
    <rect x="8" y="8" width="492" height="284" rx="10" fill="#f4f4f5"></rect>
    <rect x="700" y="8" width="492" height="284" rx="10" fill="#f4f4f5"></rect>
    <rect x="24" y="56" width="460" height="64" rx="8" fill="#dbeafe" stroke-width="1"></rect>
    <rect x="24" y="208" width="460" height="64" rx="8" fill="#cffafe" stroke-width="1"></rect>
    <rect x="716" y="56" width="460" height="64" rx="8" fill="#dbeafe" stroke-width="1"></rect>
    <rect x="716" y="208" width="460" height="64" rx="8" fill="#cffafe" stroke-width="1"></rect>
    <line x1="500" y1="32" x2="556" y2="32"></line>
    <line x1="644" y1="32" x2="700" y2="32" marker-end="url(#head)"></line>
    <line x1="500" y1="88" x2="540" y2="88"></line>
    <line x1="660" y1="88" x2="700" y2="88" marker-end="url(#head)"></line>
    <line x1="946" y1="120" x2="946" y2="208" marker-end="url(#head)"></line>
  </g>
  <g fill="#18181b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">
    <text x="254" y="32" text-anchor="middle" dominant-baseline="central">Directory A</text>
    <text x="254" y="88" text-anchor="middle" dominant-baseline="central">OCI registry</text>
    <text x="254" y="240" text-anchor="middle" dominant-baseline="central">Database</text>
    <text x="946" y="32" text-anchor="middle" dominant-baseline="central">Directory B</text>
    <text x="946" y="88" text-anchor="middle" dominant-baseline="central">OCI registry</text>
    <text x="946" y="240" text-anchor="middle" dominant-baseline="central">Database</text>
    <text x="596" y="32" text-anchor="start" dominant-baseline="central">sync</text>
    <text x="580" y="88" text-anchor="start" dominant-baseline="central">regsync</text>
    <text x="990" y="164" text-anchor="start" dominant-baseline="central">index</text>
  </g>
  <g fill="#18181b">
    <circle cx="576" cy="32" r="12"></circle>
    <circle cx="560" cy="88" r="12"></circle>
    <circle cx="970" cy="164" r="12"></circle>
  </g>
  <g fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <text x="576" y="32" text-anchor="middle" dominant-baseline="central">1</text>
    <text x="560" y="88" text-anchor="middle" dominant-baseline="central">2</text>
    <text x="970" y="164" text-anchor="middle" dominant-baseline="central">3</text>
  </g>
</svg>
